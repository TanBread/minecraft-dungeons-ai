[package]
name = "minecraft-dungeons-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rand = "0.8"
rayon = "1.10"
ndarray = "0.16"
image = "0.25"
eframe = "0.30"
egui = "0.30"
egui_plot = "0.30"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
